<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Profile</title>
    <style>

        img{
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
        }
        body{
            width: 300px;
            margin: auto;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow:0px 0px 0px 1px gray; 
            padding: 20px;
        }
        a{
            text-decoration: none;
            color: white;

            background-color: rgb(112, 211, 249);
            border-radius: 8px;
            cursor: pointer;
            padding: 10px;
            padding-left: 20px;
            padding-right: 20px;

        }
        a:hover{
            color: rgb(51, 155, 219);
        }
    </style>
    <i class="fa-solid fa-arrow-up-right-from-square"></i>
</head>
<body>
    <div align = "center">
        <img src="Profile.jpeg" alt="A profile picture" title="A picture of the Willem">

        <h1>Willem J. Viljoen</h1>

        <p>I am passionate about web development and creating user-friendly experiences. I enjoy learning new technologies and building projects that make a positive impact.</p>
        <a href="https://github.com/TheCodingMeta">View My Profile <i class="fa fa-external-link" style="font-size: small;"></i></a>
    </div>
</body>
</html>
